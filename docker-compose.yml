services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: yandex_reviews_app
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        volumes:
            - public_data:/var/www/html/public
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - app

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: yandex_reviews_queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - app

    nginx:
        image: nginx:alpine
        container_name: yandex_reviews_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - public_data:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - app

    mysql:
        image: mysql:8.4
        container_name: yandex_reviews_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - app

    redis:
        image: redis:alpine
        container_name: yandex_reviews_redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - app

networks:
    app:

volumes:
    mysql_data:
    redis_data:
    public_data:
